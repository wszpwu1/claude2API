<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude2API 管理控制台</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#111827,#334155)}.card{width:min(420px,100%);padding:32px;border-radius:18px;background:#fff;box-shadow:0 24px 60px #0004}.field{display:grid;gap:8px;margin:14px 0}.field input,.field textarea{padding:11px 13px;border:1px solid #cbd5e1;border-radius:9px}.primary,.secondary,.danger{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}.primary{color:#fff;background:#2563eb}.secondary{color:#1e293b;background:#e2e8f0}.danger{color:#fff;background:#dc2626}.wide{width:100%}.error{min-height:20px;color:#dc2626}.shell{min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;color:#fff;background:#111827}.topbar h1{margin:0;font-size:20px}.logout{padding:8px 14px;border:1px solid #ffffff55;border-radius:8px;color:#fff;background:transparent;cursor:pointer}.content{width:min(1240px,calc(100% - 32px));margin:24px auto}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:10px 16px;border:0;border-radius:9px;background:#e2e8f0;cursor:pointer}.tab.active{color:#fff;background:#2563eb}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:18px}.metric,.panel{padding:20px;border-radius:14px;background:#fff;box-shadow:0 8px 24px #0f172a10}.metric span{display:block;color:#64748b}.metric strong{display:block;margin-top:8px;font-size:25px}.panel{margin-top:18px}.panel h2{margin:0}.panel-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{justify-content:flex-start;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px;margin-top:14px}.form-grid .full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:11px;text-align:left;border-bottom:1px solid #e2e8f0}th{color:#64748b;font-weight:600}.status{padding:4px 9px;border-radius:999px;font-size:12px;background:#dcfce7;color:#166534}.empty{text-align:center;color:#94a3b8}.notice{margin:14px 0;padding:12px;border-radius:9px;background:#eff6ff;color:#1d4ed8;word-break:break-all}.chart{display:flex;align-items:flex-end;gap:8px;height:180px;margin-top:16px}.bar{flex:1;min-width:28px;background:#60a5fa;border-radius:7px 7px 0 0;position:relative}.bar span{position:absolute;bottom:-25px;width:100%;text-align:center;font-size:11px;color:#64748b}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.content{overflow-x:auto}.topbar{padding:16px}}
    :root{color-scheme:light;--text:#172033;--muted:#64748b;--page:#f3f6fb;--surface:#fff;--input:#fff;--border:#cbd5e1;--topbar:#111827;--secondary:#e2e8f0;--secondary-text:#1e293b;--shadow:#0f172a10}:root[data-theme="dark"]{color-scheme:dark;--text:#e5e7eb;--muted:#94a3b8;--page:#0f172a;--surface:#1e293b;--input:#0f172a;--border:#475569;--topbar:#020617;--secondary:#334155;--secondary-text:#f1f5f9;--shadow:#0006}body{color:var(--text);background:var(--page)}input,textarea{color:var(--text);background:var(--input)}.card,.metric,.panel{color:var(--text);background:var(--surface);box-shadow:0 8px 24px var(--shadow)}.field input,.field textarea{border-color:var(--border)}.topbar{background:var(--topbar)}.secondary,.tab{color:var(--secondary-text);background:var(--secondary)}.metric span,.empty{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px}.toolbar button{padding:8px 12px;border:1px solid #ffffff55;border-radius:8px;color:#fff;background:transparent;cursor:pointer}@media(max-width:640px){.topbar{align-items:flex-start;gap:12px;padding:16px;flex-direction:column}.toolbar{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><form id="loginForm" class="card"><h1>管理控制台</h1><p>使用管理员密码登录 Claude2API。</p><label class="field">管理员密码<input id="password" type="password" required autofocus></label><div id="loginError" class="error"></div><button id="loginButton" class="primary wide" type="submit">登录</button></form></section>
  <section id="consoleView" class="shell hidden">
    <header class="topbar"><h1 data-i18n="consoleTitle">Claude2API 管理控制台</h1><div class="toolbar"><button id="languageButton" type="button">English</button><button id="themeButton" type="button">深色</button><button id="logoutButton" class="logout" data-i18n="logout">退出登录</button></div></header>
    <main class="content">
      <nav class="tabs"><button class="tab active" data-page="stats">统计</button><button class="tab" data-page="accounts">账号</button><button class="tab" data-page="proxy">代理</button><button class="tab" data-page="rate">限速</button><button class="tab" data-page="keepalive">保活</button><button class="tab" data-page="keys">API Key</button></nav>
      <section id="stats" class="page"><div class="metrics"><article class="metric"><span>请求总数</span><strong id="requests">0</strong></article><article class="metric"><span>成功请求</span><strong id="successes">0</strong></article><article class="metric"><span>失败请求</span><strong id="failures">0</strong></article><article class="metric"><span>活跃请求</span><strong id="activeRequests">0</strong></article><article class="metric"><span>成功率</span><strong id="successRate">0%</strong></article><article class="metric"><span>平均延迟</span><strong id="latency">0 ms</strong></article></div><div class="panel"><h2>近七日请求量</h2><div id="usageChart" class="chart"></div></div></section>
      <section id="accounts" class="page hidden"><div class="panel"><div class="panel-head"><h2>账号管理</h2><div class="actions"><button id="checkAccounts" class="primary">一键测活</button><button id="refreshAccounts" class="secondary">刷新</button></div></div><form id="accountForm" class="form-grid"><label class="field">名称<input id="accountName"></label><label class="field">会话上限<input id="sessionLimit" type="number" min="0" value="0"></label><label class="field full">Session Key<input id="sessionKey"></label><label class="field full">Cookie<input id="cookie"></label><div class="actions full"><button class="primary" type="submit">添加账号</button></div></form><table><thead><tr><th>名称</th><th>状态</th><th>请求</th><th>会话用量</th><th>操作</th></tr></thead><tbody id="accountsBody"></tbody></table><form id="importForm"><label class="field">批量导入（每行一个 Session Key 或 Cookie）<textarea id="importContent" rows="5"></textarea></label><button class="secondary" type="submit">导入</button></form></div></section>
      <section id="proxy" class="page hidden"><div class="panel"><h2>代理配置</h2><form id="proxyForm"><label class="field"><span><input id="proxyEnabled" type="checkbox"> 启用上游代理</span></label><label class="field">代理 URL 模板<input id="proxyUrl" placeholder="http://proxy.example/{sid}"></label><button class="primary" type="submit">保存代理配置</button></form></div></section>
      <section id="rate" class="page hidden"><div class="panel"><h2>全局限速</h2><form id="rateForm" class="form-grid"><label class="field full"><span><input id="rateEnabled" type="checkbox"> 启用限速</span></label><label class="field">每分钟请求数<input id="rpm" type="number" min="1"></label><label class="field">突发容量<input id="burst" type="number" min="1"></label><button class="primary" type="submit">保存限速配置</button></form></div></section>
      <section id="keepalive" class="page hidden"><div class="panel"><h2>账号自动保活</h2><form id="keepAliveForm" class="form-grid"><label class="field full"><span><input id="keepAliveEnabled" type="checkbox"> 启用账号自动刷新保活</span></label><label class="field">检查间隔（分钟）<input id="keepAliveInterval" type="number" min="1" max="1440"></label><label class="field">单账号超时（秒）<input id="keepAliveTimeout" type="number" min="1" max="300"></label><button class="primary" type="submit">保存保活配置</button></form></div></section>
      <section id="keys" class="page hidden"><div class="panel"><h2>API Key 管理</h2><form id="keyForm" class="actions"><input id="keyName" placeholder="Key 名称" required><button class="primary" type="submit">创建 API Key</button></form><div id="newKey" class="notice hidden"></div><table><thead><tr><th>名称</th><th>前缀</th><th>状态</th><th>最后使用</th><th>操作</th></tr></thead><tbody id="keysBody"></tbody></table></div></section>
      <div id="message" class="notice hidden"></div>
    </main>
  </section>
  <script>
    const $=id=>document.getElementById(id),loginView=$('loginView'),consoleView=$('consoleView');
    const translations={zh:{consoleTitle:'Claude2API 管理控制台',logout:'退出登录',language:'English',light:'浅色',dark:'深色'},en:{consoleTitle:'Claude2API Admin Console',logout:'Log out',language:'中文',light:'Light',dark:'Dark'}};
    const zhToEn={'管理控制台':'Admin Console','使用管理员密码登录 Claude2API。':'Sign in to Claude2API with the administrator password.','管理员密码':'Administrator password','登录':'Sign in','统计':'Statistics','账号':'Accounts','代理':'Proxy','限速':'Rate Limit','保活':'Keep Alive','请求总数':'Total Requests','成功请求':'Successful Requests','失败请求':'Failed Requests','活跃请求':'Active Requests','成功率':'Success Rate','平均延迟':'Average Latency','近七日请求量':'Requests in the Last 7 Days','账号管理':'Account Management','一键测活':'Check All','刷新':'Refresh','名称':'Name','会话上限':'Session Limit','添加账号':'Add Account','状态':'Status','请求':'Requests','会话用量':'Session Usage','操作':'Actions','批量导入（每行一个 Session Key 或 Cookie）':'Bulk Import (one Session Key or Cookie per line)','导入':'Import','代理配置':'Proxy Configuration','启用上游代理':'Enable upstream proxy','代理 URL 模板':'Proxy URL Template','保存代理配置':'Save Proxy Configuration','全局限速':'Global Rate Limit','启用限速':'Enable rate limiting','每分钟请求数':'Requests per Minute','突发容量':'Burst Capacity','保存限速配置':'Save Rate Limit Configuration','账号自动保活':'Automatic Account Keep Alive','启用账号自动刷新保活':'Enable automatic account refresh and keep alive','检查间隔（分钟）':'Check Interval (minutes)','单账号超时（秒）':'Per-account Timeout (seconds)','保存保活配置':'Save Keep Alive Configuration','API Key 管理':'API Key Management','Key 名称':'Key Name','创建 API Key':'Create API Key','前缀':'Prefix','最后使用':'Last Used','退出登录':'Log out','暂无账号':'No accounts','暂无 API Key':'No API keys','暂无用量数据':'No usage data','未设置':'Not set','启用':'Enable','停用':'Disable','恢复限速':'Restore Rate Limit','删除':'Delete','从未':'Never'};
    let language=localStorage.getItem('admin-language')||'zh',theme=localStorage.getItem('admin-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    function translateStaticText(){const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(node.parentElement?.closest('script,style,[data-i18n]'))return;if(node._zhText===undefined)node._zhText=node.nodeValue;const original=node._zhText;const trimmed=original.trim();if(!trimmed)return;const translated=language==='en'?(zhToEn[trimmed]||trimmed):trimmed;node.nodeValue=original.replace(trimmed,translated)});document.querySelectorAll('input[placeholder]').forEach(input=>{if(input.dataset.zhPlaceholder===undefined)input.dataset.zhPlaceholder=input.placeholder;input.placeholder=language==='en'?(zhToEn[input.dataset.zhPlaceholder]||input.dataset.zhPlaceholder):input.dataset.zhPlaceholder})}
    function applyPreferences(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.documentElement.dataset.theme=theme;document.title=translations[language].consoleTitle;document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=translations[language][node.dataset.i18n]);translateStaticText();$('languageButton').textContent=translations[language].language;$('themeButton').textContent=translations[language][theme==='dark'?'light':'dark'];localStorage.setItem('admin-language',language);localStorage.setItem('admin-theme',theme)}
    $('languageButton').onclick=()=>{language=language==='zh'?'en':'zh';applyPreferences()};$('themeButton').onclick=()=>{theme=theme==='dark'?'light':'dark';applyPreferences()};applyPreferences();
    function showLogin(message=''){$('loginError').textContent=message;loginView.classList.remove('hidden');consoleView.classList.add('hidden')}
    function showConsole(){loginView.classList.add('hidden');consoleView.classList.remove('hidden')}
    function notify(message){$('message').textContent=message;$('message').classList.remove('hidden');setTimeout(()=>$('message').classList.add('hidden'),3000)}
    async function api(path,options={}){const response=await fetch('/admin/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(response.status===401){showLogin('登录已过期，请重新登录。');throw new Error('unauthorized')}if(!response.ok){let message='请求失败';try{message=(await response.json()).error?.message||message}catch{}throw new Error(message)}return response.status===204?null:response.json()}
    function text(value){const node=document.createElement('div');node.textContent=String(value??'');return node.innerHTML}
    function renderAccounts(accounts){$('accountsBody').innerHTML=accounts.length?accounts.map(a=>`<tr><td>${text(a.name)}</td><td><span class="status">${text(a.status||'unknown')}</span>${a.status_message?`<div class="empty">${text(a.status_message)}</div>`:''}</td><td>${a.request_count||0}</td><td>${a.session_limit?`${a.session_used||0} / ${a.session_limit} (${(a.session_usage_rate||0).toFixed(1)}%)`:'未设置'}</td><td><button class="secondary" onclick="toggleAccount('${a.id}',${!a.enabled})">${a.enabled?'停用':'启用'}</button> <button class="secondary" onclick="restoreAccount('${a.id}')">恢复限速</button> <button class="danger" onclick="deleteAccount('${a.id}')">删除</button></td></tr>`).join(''):'<tr><td class="empty" colspan="5">暂无账号</td></tr>'}
    function renderKeys(keys){$('keysBody').innerHTML=keys.length?keys.map(k=>`<tr><td>${text(k.name)}</td><td>${text(k.key_prefix)}...</td><td>${k.enabled?'启用':'停用'}</td><td>${k.last_used_at?new Date(k.last_used_at).toLocaleString():'从未'}</td><td><button class="secondary" onclick="toggleKey('${k.id}',${!k.enabled})">${k.enabled?'停用':'启用'}</button> <button class="danger" onclick="deleteKey('${k.id}')">删除</button></td></tr>`).join(''):'<tr><td class="empty" colspan="5">暂无 API Key</td></tr>'}
    function renderUsage(items){const grouped={};items.forEach(i=>grouped[i.date]=(grouped[i.date]||0)+i.requests);const entries=Object.entries(grouped).sort();const max=Math.max(1,...entries.map(e=>e[1]));$('usageChart').innerHTML=entries.length?entries.map(([date,count])=>`<div class="bar" title="${count} 次请求" style="height:${Math.max(8,count/max*100)}%"><span>${date.slice(5)}</span></div>`).join(''):'<div class="empty">暂无用量数据</div>'}
    async function loadConsole(){const [state,metrics,usage]=await Promise.all([api('/state'),api('/metrics'),api('/usage')]);$('requests').textContent=metrics.requests||0;$('successes').textContent=metrics.successes||0;$('failures').textContent=metrics.failures||0;$('activeRequests').textContent=metrics.active_requests||0;$('successRate').textContent=(metrics.success_rate||0).toFixed(1)+'%';$('latency').textContent=(metrics.average_latency_ms||0).toFixed(1)+' ms';renderAccounts(state.accounts||[]);renderKeys(state.api_keys||[]);$('proxyEnabled').checked=state.proxy.enabled;$('proxyUrl').value=state.proxy.url_template||'';$('rateEnabled').checked=state.rate_limit.enabled;$('rpm').value=state.rate_limit.requests_per_minute||60;$('burst').value=state.rate_limit.burst||10;$('keepAliveEnabled').checked=state.keep_alive.enabled;$('keepAliveInterval').value=state.keep_alive.interval_minutes||10;$('keepAliveTimeout').value=state.keep_alive.timeout_seconds||15;renderUsage(usage.daily_usage||[]);applyPreferences();showConsole()}
    document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==button.dataset.page))});
    $('loginForm').onsubmit=async event=>{event.preventDefault();$('loginButton').disabled=true;try{await api('/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await loadConsole()}catch(error){if(error.message!=='unauthorized')$('loginError').textContent=error.message}finally{$('loginButton').disabled=false}};
    $('logoutButton').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{showLogin()}};
    $('accountForm').onsubmit=async event=>{event.preventDefault();try{await api('/accounts',{method:'POST',body:JSON.stringify({name:$('accountName').value,session_key:$('sessionKey').value,cookie:$('cookie').value,session_limit:Number($('sessionLimit').value)})});event.target.reset();await loadConsole();notify('账号已添加')}catch(e){notify(e.message)}};
    $('importForm').onsubmit=async event=>{event.preventDefault();try{const result=await api('/accounts/import',{method:'POST',body:JSON.stringify({content:$('importContent').value})});$('importContent').value='';await loadConsole();notify(`导入 ${result.imported} 个，跳过 ${result.skipped} 个`)}catch(e){notify(e.message)}};
    window.toggleAccount=async(id,enabled)=>{try{await api('/accounts/'+id+'/status',{method:'PATCH',body:JSON.stringify({enabled})});await loadConsole()}catch(e){notify(e.message)}};window.restoreAccount=async id=>{try{await api('/accounts/'+id+'/restore',{method:'POST'});await loadConsole();notify('账号限速状态已恢复')}catch(e){notify(e.message)}};window.deleteAccount=async id=>{if(confirm('确定删除此账号？'))try{await api('/accounts/'+id,{method:'DELETE'});await loadConsole()}catch(e){notify(e.message)}};
    $('proxyForm').onsubmit=async event=>{event.preventDefault();try{await api('/proxy',{method:'PUT',body:JSON.stringify({enabled:$('proxyEnabled').checked,url_template:$('proxyUrl').value})});notify('代理配置已保存')}catch(e){notify(e.message)}};
    $('rateForm').onsubmit=async event=>{event.preventDefault();try{await api('/rate-limit',{method:'PUT',body:JSON.stringify({enabled:$('rateEnabled').checked,requests_per_minute:Number($('rpm').value),burst:Number($('burst').value)})});notify('限速配置已保存并已在运行时生效')}catch(e){notify(e.message)}};
    $('keepAliveForm').onsubmit=async event=>{event.preventDefault();try{await api('/keep-alive',{method:'PUT',body:JSON.stringify({enabled:$('keepAliveEnabled').checked,interval_minutes:Number($('keepAliveInterval').value),timeout_seconds:Number($('keepAliveTimeout').value)})});notify('保活配置已保存并已在运行时生效')}catch(e){notify(e.message)}};
    $('keyForm').onsubmit=async event=>{event.preventDefault();try{const result=await api('/api-keys',{method:'POST',body:JSON.stringify({name:$('keyName').value})});$('keyName').value='';$('newKey').textContent='请立即复制并妥善保存，此 Key 仅显示一次：'+result.key;$('newKey').classList.remove('hidden');await loadConsole()}catch(e){notify(e.message)}};
    window.toggleKey=async(id,enabled)=>{try{await api('/api-keys/'+id,{method:'PUT',body:JSON.stringify({enabled})});await loadConsole()}catch(e){notify(e.message)}};window.deleteKey=async id=>{if(confirm('确定删除此 API Key？'))try{await api('/api-keys/'+id,{method:'DELETE'});await loadConsole()}catch(e){notify(e.message)}};
    $('checkAccounts').onclick=async()=>{const button=$('checkAccounts');button.disabled=true;try{const result=await api('/accounts/check',{method:'POST'});await loadConsole();notify(`测活完成：${result.healthy} 个正常，${result.unhealthy} 个异常`)}catch(e){notify(e.message)}finally{button.disabled=false}};$('refreshAccounts').onclick=loadConsole;loadConsole().catch(error=>{if(error.message!=='unauthorized')showLogin()});setInterval(()=>{if(!consoleView.classList.contains('hidden'))loadConsole().catch(()=>{})},15000);
  </script>
</body>
</html>
